<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0b3d">
<title>Benjaboy</title>
<meta name="description" content="Corra, passe pela porta certa e chegue em primeiro!">
<meta property="og:type" content="website">
<meta property="og:title" content="Benjaboy">
<meta property="og:description" content="Corra, passe pela porta certa e chegue em primeiro!">
<meta property="og:url" content="https://diegobarbosabr.github.io/benjaboy/">
<meta property="og:image" content="https://diegobarbosabr.github.io/benjaboy/capa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css?v=5">
</head>
<body>
<canvas id="tela"></canvas>

<section id="menu" class="painel">
  <h1 class="titulo">BENJABOY</h1>
  <canvas id="retrato-menu" class="retrato"></canvas>
  <button class="botao fase" data-fase="mat">
    <span>FASE 1 · TABUADA</span>
    <span class="recorde" id="rec-mat"></span>
  </button>
  <button class="botao fase" data-fase="port">
    <span>FASE 2 · PORTUGUÊS</span>
    <span class="recorde" id="rec-port"></span>
  </button>
  <button class="botao fase" data-fase="kart">
    <span>FASE 3 · KART</span>
    <span class="recorde" id="rec-kart"></span>
  </button>
  <button class="botao fase noite" data-fase="noite">
    <span>FASE 4 · MEIA-NOITE</span>
    <span class="recorde" id="rec-noite"></span>
  </button>
  <p class="dica">Nas corridas, toque do lado <b>esquerdo</b> ou <b>direito</b> pra trocar de pista e passe pela resposta certa. Na <b>Meia-Noite</b>, ilumine as sombras com o dedo e pegue a da resposta certa!</p>
</section>

<section id="resultado" class="painel escondido">
  <p class="colocacao" id="res-pos"></p>
  <canvas id="retrato-res" class="retrato pequeno"></canvas>
  <p class="premio escondido" id="res-premio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
    VOCÊ VAI GANHAR UM KINDLE!
  </p>
  <p class="acertos" id="res-acertos"></p>
  <p class="novo-recorde escondido" id="res-recorde">NOVO RECORDE!</p>
  <p class="mensagem" id="res-msg"></p>
  <div class="treinar escondido" id="res-treinar"></div>
  <button class="botao" id="bt-denovo">CORRER DE NOVO</button>
  <button class="botao secundario" id="bt-menu">MENU</button>
</section>

<section id="pausa" class="painel transparente escondido">
  <p class="colocacao">PAUSADO</p>
  <button class="botao" id="bt-continuar">CONTINUAR</button>
  <button class="botao secundario" id="bt-sair">SAIR DA CORRIDA</button>
</section>

<section id="gire" class="painel">
  <svg class="celular" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H8C6.3 1 5 2.3 5 4v16c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V4c0-1.7-1.3-3-3-3zm1 19c0 .6-.4 1-1 1H8c-.6 0-1-.4-1-1V4c0-.6.4-1 1-1h8c.6 0 1 .4 1 1v16zm-5-2.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
  <p class="acertos">Vire o celular em pé pra jogar</p>
</section>


<button id="bt-atirar" class="escondido" aria-label="Atirar gosma">
  <span>ATIRAR</span>
  <span class="municao"><i></i><i></i><i></i></span>
</button>

<button id="bt-som" class="icone" aria-label="Ligar ou desligar o som">
  <svg id="ic-som-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <svg id="ic-som-off" class="escondido" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg>
</button>
<button id="bt-pausa" class="icone escondido" aria-label="Pausar">
  <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
</button>

<script src="js/util.js?v=5"></script>
<script src="js/conteudo.js?v=5"></script>
<script src="js/som.js?v=5"></script>
<script src="js/musica.js?v=5"></script>
<script src="js/desenho.js?v=5"></script>
<script src="js/corrida.js?v=5"></script>
<script src="js/cena.js?v=5"></script>
<script src="js/torneio.js?v=5"></script>
<script src="js/noite.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
